services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: fund_agent
      MYSQL_USER: fund_agent
      MYSQL_PASSWORD: change-me
      MYSQL_ROOT_PASSWORD: change-root-me
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ufund_agent", "-pchange-me"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  tika:
    image: apache/tika:3.3.1.0
    restart: unless-stopped
  fund-agent-go:
    build: .
    ports:
      - "8080:8080"
    environment:
      APP_ADDR: ":8080"
      FUND_PROVIDER_TYPE: "eastmoney"
      DATABASE_DRIVER: "mysql"
      DATABASE_DSN: "fund_agent:change-me@tcp(mysql:3306)/fund_agent?charset=utf8mb4&parseTime=true"
      REDIS_ADDRESS: "redis:6379"
      TIKA_URL: "http://tika:9998"
      APP_AUTH_TOKEN: "change-this-token"
      DEFAULT_USER_ID: "local-user"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      tika:
        condition: service_started
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
