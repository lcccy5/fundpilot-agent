services:
  fund-agent-go:
    build: .
    ports:
      - "8080:8080"
    environment:
      APP_ADDR: ":8080"
      FUND_PROVIDER_TYPE: "eastmoney"
      DATABASE_DRIVER: "sqlite"
      DATABASE_DSN: "file:/data/fund-agent.db?_pragma=busy_timeout(5000)&_pragma=journal_mode(WAL)"
    volumes:
      - fund-agent-data:/data
    restart: unless-stopped

volumes:
  fund-agent-data:
